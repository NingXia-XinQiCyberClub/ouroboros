version: 1
providers:
  # OpenAI 兼容 provider 示例：填入你自己的接入点与密钥环境变量名。
  # 密钥本身只经环境变量注入，providers.yaml 永远不落盘密钥值。
  - name: my-openai-compatible
    type: openai_compatible
    model: your-model-name
    base_url: https://your-provider.example/v1
    api_key_env: OURO_PROVIDER_API_KEY
    timeout_ms: 30000
    context_window_tokens: 32768
    capabilities:
      - chat
      - code
      - reasoning
    enabled: true
  - name: offline
    type: offline
    model: offline-model
    enabled: false
